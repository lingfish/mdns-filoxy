name: CI

on:
  push:
  pull_request:
    branches: [master]

# A push to a branch that also has a PR open would otherwise run twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install hatch
        run: pip install hatch

      - name: Run tests
        run: hatch test --cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install hatch
        run: pip install hatch

      - name: Ruff check
        run: hatch run lint:check

      - name: Ruff format check
        run: hatch run lint:format-check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install hatch
        run: pip install hatch

      - name: Mypy
        run: hatch run types:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install hatch
        run: pip install hatch

      - name: Build distributions
        run: hatch build
