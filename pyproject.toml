[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mdns-filoxy"
dynamic = ["version"]
description = "This is mdns-filoxy, the mDNS filter proxy!"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Jason Lingohr" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["zeroconf", "click", "loguru"]

[project.urls]
Documentation = "https://github.com/lingfish/mdns-filoxy"
Issues = "https://github.com/lingfish/mdns-filoxy/issues"
Source = "https://github.com/lingfish/mdns-filoxy"

[project.scripts]
mdns-filoxy = "mdns_filoxy.main:entry_point"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mdns_filoxy/_version.py"

[tool.hatch.envs.lint]
dependencies = [
  "ruff>=0.1.0",
]
[tool.hatch.envs.lint.scripts]
check = "ruff check {args:src tests}"
format = "ruff format {args:src tests}"
format-check = "ruff format --check {args:src tests}"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/mdns_filoxy tests}"

# `hatch test` uses Hatch's built-in `hatch-test` environment, which already ships
# pytest, coverage and friends. Only the pytest defaults are declared here.
[tool.hatch.envs.hatch-test]
default-args = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source_pkgs = ["mdns_filoxy"]
branch = true
parallel = true
omit = [
  "src/mdns_filoxy/_version.py",
]

[tool.coverage.paths]
mdns_filoxy = ["src/mdns_filoxy", "*/mdns-filoxy/src/mdns_filoxy"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mdns_filoxy"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "FA", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"
